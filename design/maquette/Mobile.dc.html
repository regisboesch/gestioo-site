<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gestioo — aperçu mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 8000px; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; color: #0E1B2C">
<dc-import name="Main" accent="{{accent}}" hint-size="390px,8000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8102E","options":["#C8102E","#1D4ED8","#0F766E","#B45309"]},"$preview":{"width":390,"height":8000}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8102E' };
  }
}
</script>
</body>
</html>
