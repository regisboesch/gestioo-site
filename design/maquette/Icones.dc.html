<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gestioo — jeu d'icônes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 760px; height: 1020px; box-sizing: border-box; padding: 40px; background: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; color: #0E1B2C">
<h1 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Jeu d'icônes</h1>
<p style="margin: 0 0 28px; color: #4A5568; font-size: 15px">Trait de 2 px, coins arrondis, une seule couleur (style Lucide). Taille de base 24 px.</p>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{icons}}" as="item" hint-placeholder-count="20">
<div style="border: 1px solid #DDE3EA; border-radius: 12px; padding: 14px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="color: {{accent}}"><dc-import name="Icon" icon="{{item.icon}}" size="28" hint-size="28px,28px"></dc-import></span>
<span style="font-size: 12px; line-height: 1.3; color: #4A5568">{{item.label}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8102E","options":["#C8102E","#1D4ED8","#0F766E","#B45309"]},"$preview":{"width":760,"height":1020}}'>
class Component extends DCLogic {
  renderVals() {
    const icons = [
      { icon: 'wallet', label: 'Trésorier' },
      { icon: 'clipboard', label: 'Secrétaire, inscriptions' },
      { icon: 'timer', label: 'Entraîneur' },
      { icon: 'users', label: 'Parent, membres' },
      { icon: 'dashboard', label: 'Président, tableau de bord' },
      { icon: 'swiss', label: 'Pensé pour la Suisse' },
      { icon: 'book', label: 'Comptabilité' },
      { icon: 'heart', label: 'Familles' },
      { icon: 'wifiOff', label: 'Hors ligne' },
      { icon: 'mic', label: 'Vocal' },
      { icon: 'shield', label: 'Droits, sécurité' },
      { icon: 'smartphone', label: 'Smartphone' },
      { icon: 'palette', label: 'Couleurs du club' },
      { icon: 'sheet', label: 'Rapports' },
      { icon: 'calendar', label: 'Planning' },
      { icon: 'idCard', label: 'Licences' },
      { icon: 'receipt', label: 'Facturation' },
      { icon: 'landmark', label: 'Trésorerie' },
      { icon: 'briefcase', label: 'Frais, fournisseurs' },
      { icon: 'megaphone', label: 'Communication' },
      { icon: 'chart', label: 'Statistiques' },
      { icon: 'sliders', label: 'Paramètres' },
      { icon: 'userCheck', label: 'Accès par rôle' },
      { icon: 'lock', label: 'Comptes protégés' },
      { icon: 'history', label: 'Traçabilité' },
      { icon: 'sparkles', label: 'IA, nouveautés' },
      { icon: 'checkCircle', label: 'Avec Gestioo, qualité' },
      { icon: 'xCircle', label: 'Avant' },
      { icon: 'check', label: 'Puce de liste' },
      { icon: 'info', label: 'Bon à savoir' },
      { icon: 'search', label: 'Recherche' },
      { icon: 'plusCircle', label: 'Création' },
      { icon: 'compass', label: 'Navigation' },
      { icon: 'globe', label: 'Langues' },
      { icon: 'qr', label: 'QR-facture' },
      { icon: 'moon', label: 'Thème sombre' },
      { icon: 'mail', label: 'Contact' },
      { icon: 'tag', label: 'Tarifs' },
      { icon: 'arrowRight', label: 'Action' },
      { icon: 'play', label: 'Lire la vidéo' },
      { icon: 'monitor', label: 'Vue ordinateur' }
    ];
    return { icons: icons, accent: this.props.accent ?? '#C8102E' };
  }
}
</script>
</body>
</html>
