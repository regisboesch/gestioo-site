<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"text","default":"wallet"},"size":{"editor":"int","default":24,"min":12,"max":96},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const icon = this.props.icon ?? 'wallet';
    const is = {};
    is[icon] = true;
    return { is: is, size: this.props.size ?? 24 };
  }
}
</script>
